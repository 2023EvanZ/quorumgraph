[project]
name = "quorumgraph"
version = "0.1.0"
description = "Quorum-based trust, authorization, and revocation for autonomous AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorumgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
